name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  laravel:
    name: Laravel (Pint, frontend build, Pest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate app key
        run: php artisan key:generate

      - name: Check code style
        run: vendor/bin/pint --test

      # Pages render through @vite, so the tests need the built manifest.
      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Run tests
        run: php artisan test

  python:
    name: Python service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-service

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: python-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # tests/conftest.py supplies a test INTERNAL_KEY and a temporary STORAGE_PATH.
      - name: Run tests
        run: python -m pytest -q
